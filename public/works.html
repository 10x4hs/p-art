<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전시관 · PART</title>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="sr">
<div id="nav"></div>

<section class="wrap page-top" id="works" aria-labelledby="works-t">
  <div class="sec-head">
    <div><a class="nav-link" href="/" style="padding-left:0">← 처음으로</a><p class="mono" style="margin-top:16px">Exhibition · <span id="total">0</span> works</p><h1 class="h2" id="works-t">전시관 <b>전체 작품</b></h1></div>
    <div class="tools">
      <label class="search glass"><span class="vh">작품 찾기</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M14 14 L18 18"></path></svg><input type="search" id="q" placeholder="작품, 만든 사람 찾기"></label>
      <div class="seg glass" role="group" aria-label="정렬">
        <button type="button" data-sort="hot" aria-pressed="true">인기순</button><button type="button" data-sort="new" aria-pressed="false">최신순</button>
      </div>
    </div>
  </div>
  <div class="chips" role="group" aria-label="분야" id="chips"></div>
  <p class="vh" aria-live="polite" id="count"></p>
  <div class="grid" id="grid"></div>
</section>
<div id="foot"></div>

<script src="/js/app.js"></script>
<script>
// 주소(?q=&cat=&sort=)에 검색 조건을 담아서, 새로고침하거나 공유해도 같은 목록이 보인다
const state = { q: param('q') || '', sort: param('sort') === 'new' ? 'new' : 'hot', cat: CATS.includes(param('cat')) ? param('cat') : '' };
$('#foot').outerHTML = FOOTER;
$('#q').value = state.q;

function chips() {
  $('#chips').innerHTML = ['', ...CATS].map((c) =>
    `<button type="button" class="chip" data-cat="${c}" aria-pressed="${state.cat === c}">${c || '전체'}</button>`).join('');
}
function sorts() { $$('[data-sort]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.sort === state.sort)); }

async function list() {
  const qs = new URLSearchParams({ q: state.q, sort: state.sort, cat: state.cat });
  history.replaceState(null, '', '/works.html?' + qs);
  const rows = (await api('/api/projects?' + qs)).filter((p) => p.is_public);
  $('#total').textContent = rows.length;
  $('#count').textContent = `작품 ${rows.length}개`;
  $('#grid').innerHTML = rows.length ? rows.map(card).join('') :
    `<div class="empty glass"><p>${state.q || state.cat ? '찾는 작품이 아직 없어요.' : '아직 걸린 작품이 없어요.'}</p><a class="btn btn-hot" href="/edit.html">첫 번째로 걸어 보기</a></div>`;
}

$('#chips').onclick = (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; state.cat = b.dataset.cat; chips(); list(); };
$$('[data-sort]').forEach((b) => (b.onclick = () => { state.sort = b.dataset.sort; sorts(); list(); }));
let qt;
$('#q').oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); list(); }, 250); };

nav(); chips(); sorts(); list();
</script>
</body>
</html>
