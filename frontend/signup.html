<!doctype html>
<!-- ==========================================================================
  [파일 개요] 회원가입 페이지(`/signup.html`)예요.
  - `app.js`의 `stepForm()`을 사용해 ① 이메일 → ② 비밀번호(8자 이상, 영문+숫자) → ③ 닉네임(2~20자)을
    단계 표시(`1 / 3`)와 함께 한 칸씩 차례대로 입력받아요.
  - 가입에 성공하면 서버가 즉시 로그인 세션까지 만들어 주어 바로 작품을 걸러 갈 수 있어요.
  [비유] 미술관에 처음 온 학생 작가가 작가 등록 카드를 작성하는 곳이에요.
=========================================================================== -->
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>가입 · PART</title>
<!-- [뜻/역할] 공유 미리보기 기본 메타 태그예요. -->
<meta name="description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:type" content="website"><meta property="og:site_name" content="PART">
<meta property="og:title" content="PART · 학생 작품 전시관">
<meta property="og:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<meta property="og:url" content="https://p-art.swx2.workers.dev/signup.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PART · 학생 작품 전시관">
<meta name="twitter:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta name="twitter:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-page">
<img src="/img/hero.jpg" alt="">
<div class="veil"></div>
<header><a class="auth-logo" href="/" aria-label="PART 처음으로"><span class="p">P</span><span class="art">ART</span></a></header>
<main>
<h1 class="vh">가입</h1>
<div id="step" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px"></div>
</main>
<footer><span>이미 가입했나요?</span><span aria-hidden="true">·</span><a href="/login.html">로그인</a></footer>
</div>
<script src="/js/app.js"></script>
<script>
// [뜻/역할] 3단계 가입 폼을 실행해요(`counter: true` 옵션으로 상단에 `1 / 3` 진행도를 표시해요).
// [문법] 만약 서버에서 이미 가입된 이메일이라고 `409 Conflict` 에러를 돌려주면 `flow.goTo(0, err.message)`로 첫 번째(이메일) 단계로 자동 복귀시켜 다른 이메일을 입력하게 안내해요.
const flow = stepForm([
  { ph: '이메일', type: 'email', auto: 'email', mode: 'email', check: (v) => { if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())) throw new Error('이메일 주소를 확인해 주세요'); } },
  { ph: '비밀번호 (8자 이상, 영문+숫자)', type: 'password', auto: 'new-password', check: (v) => { if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(v)) throw new Error('비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요'); } },
  { ph: '닉네임 (나중에 바꿀 수 있어요)', auto: 'nickname', check: (v) => { const n = v.trim().length; if (n < 2 || n > 20) throw new Error('닉네임은 2~20자로 써 주세요'); } },
], async ([email, password, nickname]) => {
  try {
    await api('/api/signup', 'POST', { email: email.trim(), password, nickname: nickname.trim() });
    $('#step').innerHTML = `<div class="auth-done"><p class="t">가입 완료</p><p class="s">${esc(nickname.trim())} 님, 이제 작품을 걸 수 있어요.</p><a href="/edit.html">내 작품 걸기 <span aria-hidden="true">→</span></a></div>`;
    $('.auth-done a').focus();
  } catch (err) { flow.goTo(err.status === 409 ? 0 : 2, err.message); }
}, { counter: true });
</script>
</body>
</html>
