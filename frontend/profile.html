<!doctype html>
<!-- [파일 개요] 프로필(/profile.html?id=회원번호): 이름·소개, 걸어 둔 작품, 함께 만든 작품. 내 프로필이면 정보 수정·작품 통계·모아 보기(북마크)도 보여요. -->
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로필 · PART</title>
<!-- 공유 미리보기 기본값. 작품 페이지는 서버(backend/src/og.js)가 작품마다 바꿔 보내요. -->
<meta name="description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:type" content="website"><meta property="og:site_name" content="PART">
<meta property="og:title" content="PART · 학생 작품 전시관">
<meta property="og:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<meta property="og:url" content="https://p-art.swx2.workers.dev/profile.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PART · 학생 작품 전시관">
<meta name="twitter:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta name="twitter:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="sr">
<div id="nav"></div>
<main class="wrap page-top">
  <section id="info"></section>
  <div class="sec-head" style="margin:72px 0 34px"><div><p class="mono">Works</p><h2 class="h2" id="worksTitle">걸어 둔 <b>작품</b></h2></div></div>
  <div class="grid" id="grid"></div>
  <div id="stats"></div>
  <div id="team"></div>
  <div id="saved"></div>
</main>
<div id="foot"></div>

<script src="/js/app.js"></script>
<script>
const id = param('id');
// 섹션 제목이에요. 위의 '걸어 둔 작품'과 같은 모양이에요.
const head = (en, ko) => `<div class="sec-head" style="margin:72px 0 34px"><div><p class="mono">${en}</p><h2 class="h2">${ko}</h2></div></div>`;

(async () => {
  const me = await nav();
  const u = await api('/api/users/' + id).catch(() => null);
  if (!u) return ($('#info').innerHTML = notFound('없는 사용자예요.'));
  const mine = me && me.id === u.id;
  document.title = u.nickname + ' · PART';
  $('#info').innerHTML = mine ? `
    <form class="prof glass" id="pf">
      <p class="mono">My page · 내 정보</p>
      <div class="row"><span>로그인 이메일</span><span>${esc(me.email)}</span></div>
      <div class="f"><label for="p-nick">닉네임</label><input class="field-in" id="p-nick" name="nickname" value="${esc(u.nickname)}" maxlength="20"></div>
      <div class="f"><label for="p-bio">소개</label><textarea class="field-in" id="p-bio" name="bio" maxlength="200" placeholder="어떤 걸 만드는지 한두 줄로">${esc(u.bio)}</textarea></div>
      <p class="form-msg" id="err" role="status"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-hot">저장</button>
        <button class="btn" type="button" id="out">로그아웃</button>
        <button class="btn btn-danger" type="button" id="bye">회원 탈퇴</button>
      </div>
    </form>` : `
    <div class="prof glass">
      <p class="mono">Maker</p>
      <h1 class="prof-name">${esc(u.nickname)}</h1>
      ${u.bio ? `<p style="color:var(--mute);font-weight:300">${esc(u.bio)}</p>` : ''}
    </div>`;
  if (mine) {
    $('#worksTitle').innerHTML = '내가 건 <b>작품</b>';
    $('#pf').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      try { const r = await api('/api/me', 'PUT', { nickname: f.nickname.value.trim(), bio: f.bio.value }); $('#err').textContent = ''; toast('저장했어요'); $('.nav-me').textContent = r.nickname; }
      catch (err) { $('#err').textContent = '⚠ ' + err.message; }
    };
    $('#out').onclick = async () => { await api('/api/logout', 'POST'); location.href = '/'; };
    $('#bye').onclick = async () => {
      if (confirm('계정과 작품, 받은 감상이 모두 삭제돼요. 정말 탈퇴할까요?')) { await api('/api/me', 'DELETE'); location.href = '/'; }
    };
  }
  // 내 프로필이면 서버가 비공개 작품까지 보내 줘요.
  const list = await api('/api/projects?sort=new&user=' + id);
  $('#grid').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty glass"><p>아직 걸린 작품이 없어요.</p>${mine ? '<a class="btn btn-hot" href="/edit.html">내 작품 걸기</a>' : ''}</div>`;
  // 내 작품마다 조회·응원·감상·북마크 수를 표로 보여 줘요(나만 봐요).
  if (mine && list.length) $('#stats').innerHTML = head('Stats', '작품 <b>통계</b>') + `<div class="tbl glass"><table>
    <thead><tr><th scope="col">작품</th><th scope="col">조회</th><th scope="col">응원</th><th scope="col">감상</th><th scope="col">북마크</th></tr></thead>
    <tbody>${list.map((p) => `<tr><td><a href="/project.html?id=${p.id}">${esc(p.title)}</a></td><td>${p.views}</td><td>${p.likes}</td><td>${p.comments}</td><td>${p.bookmarks}</td></tr>`).join('')}</tbody>
  </table></div>`;
  // 팀원으로 들어간 작품, 내 프로필이면 북마크한 작품(모아 보기)도 보여요.
  const team = await api('/api/projects?sort=new&member=' + id);
  if (team.length) $('#team').innerHTML = head('Team', '함께 만든 <b>작품</b>') + `<div class="grid">${team.map(card).join('')}</div>`;
  if (!mine) return;
  const saved = await api('/api/projects?sort=new&bookmarked=1');
  $('#saved').innerHTML = head('Saved', '모아 <b>보기</b>') + (saved.length ? `<div class="grid">${saved.map(card).join('')}</div>`
    : '<div class="empty glass"><p>아직 북마크한 작품이 없어요. 작품 페이지에서 ☆ 북마크를 눌러 보세요.</p><a class="btn btn-hot" href="/works.html">전시관 둘러보기</a></div>');
})();
</script>
</body>
</html>
