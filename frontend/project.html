<!doctype html>
<!-- ==========================================================================
  [파일 개요] 작품 하나를 자세히 감상하는 작품 상세 페이지(`/project.html?id=번호`)예요.
  - 작품 소개, 바로 해 보기 링크, ▲ 응원, ☆ 북마크, 사이트 미리보기(sandbox iframe), 만든 이야기,
    화면 스크린샷, 함께 만든 팀원, 💬 한 줄 감상 방명록, 🚩 신고 기능을 제공해요.
  - 내가 올린 작품(`p.mine`)이면 조회·응원·감상·북마크 통계와 홍보 키트·고치기·내리기 버튼도 함께 보여요.
  [비유] 전시실 벽에 걸린 작품 한 점 앞의 상세 해설판이자 관람객 방명록 코너예요.
=========================================================================== -->
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작품 · PART</title>
<!-- [뜻/역할] 공유 미리보기 기본 태그예요. 실제 공개 작품 주소(`/project.html?id=번호`)로 요청이 오면 서버(`backend/src/og.js`)가 이 태그들을 그 작품의 제목·소개·대표 사진으로 실시간 교체해서 보내 줘요. -->
<meta name="description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:type" content="website"><meta property="og:site_name" content="PART">
<meta property="og:title" content="PART · 학생 작품 전시관">
<meta property="og:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta property="og:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<meta property="og:url" content="https://p-art.swx2.workers.dev/project.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PART · 학생 작품 전시관">
<meta name="twitter:description" content="수행평가로 만든 웹페이지·게임·도구를 링크 대신 작품처럼 걸어 두는 학생 전시관이에요.">
<meta name="twitter:image" content="https://p-art.swx2.workers.dev/img/hero.jpg">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="sr">
<div id="nav"></div>
<main id="main"></main>
<div id="foot"></div>

<script src="/js/app.js"></script>
<script>
// [뜻/역할] 주소창에서 작품 번호(`id`)를 읽고, 상단 메뉴(`nav()`)를 그리면서 로그인한 사용자 정보를 프로미스(`meP`)로 받아 둬요.
const id = param('id');
const meP = nav();

// [뜻/역할] 북마크 상태(`on`)에 따라 버튼 글자를 `'★ 북마크됨'` 또는 `'☆ 북마크'`로 돌려줘요.
const bmLabel = (on) => (on ? '★ 북마크됨' : '☆ 북마크');

// [뜻/역할] 작품 상세 정보와 다른 추천 작품 3개를 불러와 화면 전체(`#main`)를 그리고 버튼 이벤트들을 연결해요.
// [문법]
// - 작품이 없거나 남의 비공개/숨김 작품이어서 에러가 나면 `.catch(() => null)`로 받아 안내 화면(`notFound`)을 보여 줘요.
// - 내 작품(`p.mine`)일 때만 조회·응원·감상·북마크 통계(`.stats`)와 홍보 키트·고치기·내리기 버튼(`.owner`)을 렌더링해요.
// - 로그인한 다른 회원(`me && !p.mine`)에게만 '신고' 버튼(`#report`)을 보여 줘요.
async function load() {
  const me = await meP;
  const p = await api('/api/projects/' + id).catch(() => null);
  if (!p) return ($('#main').innerHTML = `<div class="wrap page-top">${notFound('없거나 비공개인 작품이에요.')}</div>`);
  document.title = p.title + ' · PART';
  const others = (await api('/api/projects?sort=hot')).filter((o) => o.id !== p.id && o.is_public).slice(0, 3);
  $('#main').innerHTML = `
  <header class="d-hero">
    <div class="hero-bg"><img src="${esc(imgOf(p))}" alt=""></div>
    <div class="hero-shade"></div>
    <div class="wrap" style="width:100%;padding-bottom:56px">
      <div class="d-panel glass">
        <a class="nav-link" href="/works.html" style="align-self:flex-start;padding-left:0">← 전시관</a>
        <p class="mono">${esc(p.cats.join(' · ') || '작품')}${p.is_public ? '' : ' · 비공개'}</p>
        ${p.hidden ? '<p class="form-msg">⚠ 숨김 처리됨 — 신고가 쌓여 전시관에서 가려졌어요. 관리자가 확인하면 다시 보여요.</p>' : ''}
        <h1>${esc(p.title)}</h1>
        <p style="font-size:16px;font-weight:300;color:var(--ink)">${esc(p.summary)}</p>
        <p class="mono">by ${esc(makerOf(p))}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn btn-hot" href="${esc(p.url)}" target="_blank" rel="noopener">바로 해 보기 <span class="arr" aria-hidden="true">↗</span></a>
          ${upBtn(p, true)}
          <button class="btn" type="button" id="bm" aria-pressed="${p.bookmarked}">${bmLabel(p.bookmarked)}</button>
          <button class="btn" type="button" id="pvBtn" aria-expanded="false" aria-controls="pv">미리보기</button>
          <button class="btn" type="button" id="share">주소 복사</button>
          ${me && !p.mine ? '<button class="btn btn-danger" type="button" id="report">신고</button>' : ''}
        </div>
        ${p.mine ? `<div class="stats" aria-label="내 작품 통계">
          <div><b>${p.views}</b><span>조회</span></div>
          <div><b data-cheers="${p.id}">${p.likes}</b><span>응원</span></div>
          <div><b>${p.comments}</b><span>감상</span></div>
          <div><b id="bmCount">${p.bookmarks}</b><span>북마크</span></div>
        </div>
        <div class="owner">
          <a class="btn" href="/kit.html?id=${p.id}">홍보 키트</a>
          <a class="btn" href="/edit.html?id=${p.id}">고치기</a>
          <button class="btn btn-danger" type="button" id="del">내리기</button></div>` : ''}
      </div>
    </div>
  </header>

  <div class="wrap sec d-grid">
    <div>
      <section class="site-pv hide" id="pv" style="margin-bottom:56px" aria-label="사이트 미리보기"></section>
      <section class="d-sec"><h2 class="mono">Story · 만든 이야기</h2><p class="quote">${p.detail ? esc(p.detail).replace(/\n/g, '<br>') : '<span style="color:var(--dim)">아직 쓰지 않았어요.</span>'}</p></section>
      <section class="d-sec"><h2 class="mono">For · 이런 친구한테 추천</h2><p class="quote" style="color:var(--mute)">${esc(p.target || '누구나')}</p></section>
      ${p.images.length > 1 ? `<section class="d-sec"><h2 class="mono">Screens · 화면</h2><div class="shots">${p.images.map((s) => `<a href="${esc(s)}" target="_blank" rel="noopener"><img src="${esc(s)}" alt="${esc(p.title)} 화면" loading="lazy"></a>`).join('')}</div></section>` : ''}
      <section class="d-sec" aria-labelledby="g-t">
        <h2 class="mono" id="g-t">Guestbook · 방명록 <span id="gcount">${p.comments}</span></h2>
        <form class="gform" id="gform">
          <label class="vh" for="gname">이름</label>
          <input class="field-in g-name" id="gname" maxlength="12" placeholder="이름 (선택)">
          <label class="vh" for="gtext">한 줄 감상</label>
          <input class="field-in" id="gtext" maxlength="80" placeholder="써 본 느낌을 한 줄로 남겨 주세요" required>
          <button class="btn btn-hot" type="submit">남기기</button>
        </form>
        <ul class="glist" id="glist"></ul>
      </section>
    </div>
    <aside class="side glass" aria-label="작품 정보">
      <div class="row"><span>응원</span><span><span data-cheers="${p.id}">${p.likes}</span>개</span></div>
      <div class="row"><span>분야</span><span>${esc(p.cats.join(', ') || '—')}</span></div>
      <div class="row"><span>만든 사람</span><span>${esc(makerOf(p))}</span></div>
      <div class="row"><span>올린 사람</span><span><a href="/profile.html?id=${p.user_id}">${esc(p.author)}</a></span></div>
      ${p.members.length ? `<div class="row"><span>함께 만든 사람</span><span class="mates">${p.members.map((m) => `<a href="/profile.html?id=${m.id}">${esc(m.nickname)}</a>`).join('')}</span></div>` : ''}
      ${p.github ? `<div class="row"><span>코드</span><span><a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub ↗</a></span></div>` : ''}
      ${p.tags.length ? `<div class="tech" aria-label="기술">${p.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      <p style="color:var(--dim);font-size:13px">친구한테 보낼 땐 링크보다 이 페이지 주소가 더 잘 눌려요.</p>
    </aside>
  </div>

  ${others.length ? `<section class="wrap" style="padding-bottom:110px" aria-labelledby="o-t">
    <h2 class="mono" id="o-t" style="margin-bottom:20px">Also on view · 이 작품도 걸려 있어요</h2>
    <div class="others">${others.map((o) => `<a class="mini" href="/project.html?id=${o.id}" style="text-decoration:none;display:block"><img src="${esc(imgOf(o))}" alt="" loading="lazy"><div><b style="font-weight:500">${esc(o.title)}</b><span>▲ ${o.likes}</span></div></a>`).join('')}</div>
  </section>` : '<div style="height:80px"></div>'}`;

  // [뜻/역할] '주소 복사' 버튼을 누르면 현재 작품의 공유 주소를 클립보드에 복사해요.
  $('#share').onclick = () => copyText(pageUrl(p.id), '작품 주소를 복사했어요');

  // [뜻/역할] '미리보기' 버튼(`#pvBtn`)을 눌렀을 때만 외부 작품 사이트를 안전한 샌드박스 `<iframe>`으로 불러와 보여 줘요.
  // [문법] `sandbox="allow-scripts allow-forms allow-same-origin allow-popups"`와 `referrerpolicy="no-referrer"`를 걸어 외부 사이트가 부모 창(PART)을 마음대로 이동시키거나 조작하지 못하게 격리해요.
  // [작성 이유] 상세 페이지를 열자마자 무조건 iframe을 불러오면 데이터가 낭비되고 느려지므로, 사용자가 버튼을 눌러 요청했을 때만 지연 생성(Lazy Load)해요.
  $('#pvBtn').onclick = () => {
    const box = $('#pv'), open = !box.classList.toggle('hide');
    $('#pvBtn').setAttribute('aria-expanded', open);
    if (open && !box.innerHTML) box.innerHTML = `<h2 class="mono">Preview · 사이트 미리보기</h2>
      <iframe src="${esc(p.url)}" title="${esc(p.title)} 미리보기" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
      <p>사이트가 미리보기를 막으면 '바로 해 보기'로 열어 주세요.</p>`;
    if (open) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  // [뜻/역할] '☆ 북마크' 버튼(`#bm`)을 누르면 서버에 북마크 토글 요청을 보내고 버튼 표시와 통계 숫자를 업데이트해요.
  $('#bm').onclick = async () => {
    try {
      const r = await api(`/api/projects/${p.id}/bookmark`, 'POST');
      $('#bm').setAttribute('aria-pressed', r.bookmarked);
      $('#bm').textContent = bmLabel(r.bookmarked);
      if ($('#bmCount')) $('#bmCount').textContent = r.bookmarks;
      toast(r.bookmarked ? '북마크했어요. 내 프로필에서 모아 볼 수 있어요' : '북마크를 뺐어요');
    } catch (err) { if (err.status === 401) { toast('로그인하면 북마크할 수 있어요'); setTimeout(toLogin, 900); } else toast(err.message); }
  };

  // [뜻/역할] '신고' 버튼(`#report`)을 누르면 신고 사유를 입력받아 서버에 전송해요.
  $('#report')?.addEventListener('click', async () => {
    const reason = prompt('신고하는 까닭을 짧게 적어 주세요 (100자까지)');
    if (reason === null) return;
    try { await api(`/api/projects/${p.id}/report`, 'POST', { reason }); toast('신고했어요. 관리자가 살펴볼게요'); }
    catch (err) { toast(err.message); }
  });

  // [뜻/역할] 내 작품의 '내리기' 버튼(`#del`)을 누르면 확인창을 거쳐 작품을 삭제하고 내 프로필로 이동해요.
  $('#del')?.addEventListener('click', async () => {
    if (!confirm('작품을 내릴까요? 사진과 감상도 함께 지워져요.')) return;
    await api('/api/projects/' + p.id, 'DELETE');
    location.href = '/profile.html?id=' + p.user_id;
  });

  // [뜻/역할] 방명록 폼(`#gform`) 제출 시 새 한 줄 감상을 서버에 등록하고 방명록 목록(`guests()`)을 새로 고쳐요.
  $('#gform').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/api/projects/${p.id}/comments`, 'POST', { name: $('#gname').value, text: $('#gtext').value });
      $('#gtext').value = '';
      toast('감상을 남겼어요');
      guests();
    } catch (err) { toast(err.message); }
  };
  guests();
}

// [뜻/역할] 서버에서 이 작품의 한 줄 감상 목록을 받아 와 `#glist`에 그리고, 작품 주인(`g.canDelete`)에게는 각 감상 옆에 '지우기' 버튼을 보여 줘요.
async function guests() {
  const rows = await api(`/api/projects/${id}/comments`);
  $('#gcount').textContent = rows.length;
  $('#glist').innerHTML = rows.length ? rows.map((g) => `<li class="glass"><span class="av" aria-hidden="true"></span>
      <span class="g-txt">${esc(g.text)}</span><span class="g-who">${esc(g.name)}</span>
      ${g.canDelete ? `<button class="g-del" type="button" data-del="${g.id}" aria-label="이 감상 지우기">지우기</button>` : ''}</li>`).join('')
    : '<p style="color:var(--dim);margin-top:14px">아직 감상이 없어요. 첫 번째로 남겨 주세요.</p>';
}

// [뜻/역할] 방명록의 '지우기' 버튼(`[data-del]`) 클릭을 이벤트 위임으로 받아 감상을 삭제해요.
$('#main').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]');
  if (!b || !confirm('이 감상을 지울까요?')) return;
  await api(`/api/projects/${id}/comments/${b.dataset.del}`, 'DELETE').catch((err) => toast(err.message));
  guests();
});

load();
</script>
</body>
</html>
