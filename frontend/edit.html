<!doctype html>
<!-- [파일 개요] 작품 걸기(등록) 및 고치기(수정) 페이지(/edit.html, 수정 시 ?id=번호) — 왼쪽 폼에 입력하는 즉시 오른쪽 미리보기 카드가 실시간으로 바뀌어요. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작품 걸기 · PART</title>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="sr">
<div id="nav"></div>

<div class="wrap reg" style="padding-bottom:110px">
  <!-- [왼쪽 영역] 작품 정보 입력 폼 -->
  <div>
    <a class="nav-link" href="/works.html" style="padding-left:0">← 전시관</a>
    <p class="mono" style="margin-top:20px" id="kicker">New exhibit</p>
    <h1 class="h2" style="font-size:clamp(28px,3.2cqi,42px)" id="head">내 작품을 <b>걸어 볼까요?</b></h1>
    <p style="color:var(--mute);font-weight:300;margin:16px 0 36px">1분이면 끝나요. 오른쪽 카드가 입력하는 대로 바뀌어요.</p>

    <form class="form" id="form" novalidate>
      <label class="drop"><input type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple><b>대표 사진 올리기</b><span id="photoHint">jpg·png·webp, 5장·장당 5MB까지. 첫 장이 대표 사진이에요</span></label>
      <div class="f"><label for="f-title">작품 이름 <span class="req">필수</span></label><input class="field-in" id="f-title" name="title" maxlength="40" placeholder="예: 급식 레이더"></div>
      <div class="f"><label for="f-sum">한 줄 소개 <span class="req">필수</span></label><input class="field-in" id="f-sum" name="summary" maxlength="100" placeholder="무엇을 하는 작품인지 한 문장으로"></div>
      <div class="f"><label for="f-maker">만든 사람 <span class="req">필수</span></label><input class="field-in" id="f-maker" name="maker" maxlength="30" placeholder="예: 1학년 4반 홍길동"></div>
      <div class="f"><label for="f-demo">체험 주소 <span class="req">필수</span></label><input class="field-in" id="f-demo" name="url" type="text" inputmode="url" placeholder="https://"></div>
      <div class="f"><label for="f-target">이런 친구한테 추천</label><input class="field-in" id="f-target" name="target" maxlength="50" placeholder="예: 아침마다 급식표 찾는 친구"></div>
      <div class="f"><label for="f-story">만든 이야기</label><textarea class="field-in" id="f-story" name="detail" maxlength="2000" placeholder="왜 만들었는지, 어떻게 쓰는지"></textarea></div>
      <fieldset class="f tagbox" id="cats"><legend>분야</legend></fieldset>
      <div class="f"><label for="f-tags">쓴 기술 (쉼표로 구분)</label><input class="field-in" id="f-tags" name="tags" placeholder="예: HTML, CSS, JavaScript"></div>
      <div class="f"><label for="f-gh">GitHub 주소</label><input class="field-in" id="f-gh" name="github" type="text" inputmode="url" placeholder="https://github.com/"></div>
      <div class="f"><label class="check"><input type="checkbox" id="pub" checked> 전시관에 공개하기</label></div>
      <p class="form-msg" id="err" role="status"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-hot" type="submit" id="submit">전시 시작하기 <span class="arr" aria-hidden="true">→</span></button>
        <button class="btn" type="button" id="fill">예시로 채우기</button>
      </div>
    </form>
  </div>

  <!-- [오른쪽 영역] 실시간 미리보기 카드 -->
  <div class="prev">
    <p class="mono">Preview · 미리보기</p>
    <article class="card">
      <div class="card-img"><img id="pvImg" src="/img/hero.jpg" alt="미리보기 사진"></div>
      <div class="card-top"><span class="pill glass mono" id="pvTag">작품</span><span class="pill glass mono" style="color:var(--ink)">New</span></div>
      <div class="card-bar glass">
        <div class="card-t"><h3 id="pvTitle">작품 이름</h3><p id="pvSum">한 줄 소개가 여기에 보여요</p><p class="mono">▶ 바로 해 보기 · <span id="pvMaker">만든 사람</span></p></div>
        <span class="up" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2.5 L14.5 11.5 H1.5 Z"></path></svg><b>0</b></span>
      </div>
    </article>
  </div>
</div>
<div id="foot"></div>

<script src="/shared/categories.js"></script>
<script src="/js/app.js"></script>
<script>
// [뜻/역할] 주소창에 `?id=번호`가 있으면 '수정 모드', 없으면 '새 작품 등록 모드'로 동작해요.
const id = param('id'), form = $('#form');
// [뜻/역할] 사용자가 선택한 분야들을 중복 없이 담아 두는 집합(Set) 객체예요.
const picked = new Set();
// [뜻/역할] 수정 모드일 때 기존 대표 사진 경로(oldImg)와 새로 고른 사진의 임시 브라우저 주소(blobUrl)를 보관해요.
let oldImg = null, blobUrl = null;
$('#foot').outerHTML = FOOTER;

// [뜻/역할] 분야 선택 칩들을 그리고, picked 집합에 들어 있는 분야는 선택된 상태(aria-pressed="true")로 표시해요.
function drawCats() {
  $('#cats').innerHTML = '<legend>분야</legend>' + CATS.map((c) =>
    `<button type="button" class="chip" data-cat="${c}" aria-pressed="${picked.has(c)}">${c}</button>`).join('');
}
// [뜻/역할] 분야 칩을 누르면 picked에 넣거나 빼고(토글), 칩과 오른쪽 미리보기 카드를 즉시 갱신해요.
$('#cats').onclick = (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  picked.has(b.dataset.cat) ? picked.delete(b.dataset.cat) : picked.add(b.dataset.cat);
  drawCats(); preview();
};

// [뜻/역할] 왼쪽 입력칸에 글자를 칠 때마다 오른쪽 미리보기 카드의 제목, 한 줄 소개, 만든 사람, 대표 분야 배지를 실시간으로 바꿔 줘요.
function preview() {
  $('#pvTitle').textContent = form.title.value.trim() || '작품 이름';
  $('#pvSum').textContent = form.summary.value.trim() || '한 줄 소개가 여기에 보여요';
  $('#pvMaker').textContent = form.maker.value.trim() || '만든 사람';
  $('#pvTag').textContent = [...picked][0] || '작품';
}
form.addEventListener('input', preview);

// [뜻/역할] 파일 선택창에서 사진을 고르면 첫 번째 사진을 `URL.createObjectURL`로 서버 업로드 전에 미리보기에 바로 띄워 주고, 선택한 장수를 안내해요.
form.images.onchange = () => {
  const files = [...form.images.files];
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = files[0] ? URL.createObjectURL(files[0]) : null;
  $('#pvImg').src = blobUrl || oldImg || FALLBACK_IMG;
  $('#photoHint').textContent = files.length
    ? `${files.length}장 골랐어요${files.length > 5 ? ' — 5장까지만 올릴 수 있어요' : ''}${id ? ' (저장하면 기존 사진이 바뀌어요)' : ''}`
    : 'jpg·png·webp, 5장·장당 5MB까지. 첫 장이 대표 사진이에요';
};

// [뜻/역할] '예시로 채우기' 버튼을 누르면 어떻게 적어야 할지 막막한 학생을 위해 샘플 데이터를 자동으로 채워 줘요.
$('#fill').onclick = () => {
  form.title.value = 'PART';
  form.summary.value = '프로젝트를 작품처럼 거는 학생 전시관';
  form.maker.value = form.maker.value || '1학년 4반 홍길동';
  form.url.value = 'https://example.com/part';
  form.target.value = '작품을 만들었는데 보여 줄 데가 없는 친구';
  form.detail.value = '친구가 보낸 작품 링크를 열어 보지 않게 되는 게 아쉬워서, 카드처럼 걸어 두는 전시관을 만들었어요.';
  form.tags.value = 'HTML, CSS, JavaScript';
  picked.clear(); picked.add('웹사이트'); picked.add('학교생활');
  drawCats(); preview();
};

// [뜻/역할] 필수 입력칸이 비었거나 형식이 틀렸을 때 해당 입력칸에 빨간 테두리(.bad)와 포커스를 주고 경고 문구를 띄워요.
function bad(input, msg) {
  $$('.bad', form).forEach((el) => el.classList.remove('bad'));
  if (input) { input.classList.add('bad'); input.focus(); }
  $('#err').textContent = msg ? '⚠ ' + msg : '';
}
const isHttp = (u) => /^https?:\/\/\S+$/.test(u);

// [뜻/역할] '전시 시작하기 / 저장하기' 버튼을 눌렀을 때 입력값을 검사하고 `FormData`로 묶어 서버에 전송해요.
form.onsubmit = async (e) => {
  e.preventDefault();
  if (!form.title.value.trim()) return bad(form.title, '작품 이름을 적어 주세요.');
  if (!form.summary.value.trim()) return bad(form.summary, '한 줄 소개를 적어 주세요.');
  if (!form.maker.value.trim()) return bad(form.maker, '만든 사람을 적어 주세요.');
  if (!isHttp(form.url.value.trim())) return bad(form.url, 'http:// 나 https:// 로 시작하는 주소를 넣어 주세요.');
  if (form.github.value.trim() && !isHttp(form.github.value.trim())) return bad(form.github, 'GitHub 주소는 https:// 로 시작해야 해요.');
  if (form.images.files.length > 5) return bad(null, '사진은 5장까지예요.');
  bad(null, '');

  // [뜻/역할] 폼 안의 모든 글과 사진 파일을 FormData 상자에 담고, 선택한 분야(cats)와 공개 여부(is_public)도 추가해요.
  const data = new FormData(form);
  for (const k of ['url', 'github']) data.set(k, form[k].value.trim());
  data.set('cats', [...picked].join(','));
  data.set('is_public', $('#pub').checked ? '1' : '0');
  // [뜻/역할] 업로드 중 버튼을 두 번 누르지 못하게 비활성화해요.
  $('#submit').disabled = true;
  try {
    // [뜻/역할] 수정 모드(id 있음)면 PUT, 새 작품이면 POST로 보내고, 성공하면 새 작품은 홍보 키트(/kit.html)로, 수정은 작품 상세(/project.html)로 이동해요!
    const r = await api(id ? '/api/projects/' + id : '/api/projects', id ? 'PUT' : 'POST', data);
    location.href = id ? '/project.html?id=' + r.id : '/kit.html?id=' + r.id;
  } catch (err) { bad(null, err.message); $('#submit').disabled = false; }
};

// [뜻/역할] 페이지가 열릴 때 로그인 여부를 확인하고(비로그인이면 로그인 페이지로 이동), 수정 모드라면 기존 작품 정보를 불러와 칸에 채워 넣어요.
(async () => {
  const me = await nav();
  if (!me) return (location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search));
  drawCats();
  // [뜻/역할] 새 작품 등록이면 '만든 사람' 칸에 내 닉네임을 기본으로 넣어 주고 끝내요.
  if (!id) { form.maker.value = me.nickname; preview(); return; }

  // [뜻/역할] 수정 모드라면 기존 작품 데이터를 가져오고, 내 작품이 아니면 홈으로 돌려보내요.
  const p = await api('/api/projects/' + id).catch(() => null);
  if (!p || !p.mine) return (location.href = '/');
  document.title = '작품 고치기 · PART';
  $('#kicker').textContent = 'Edit';
  $('#head').innerHTML = '작품을 <b>고쳐 볼까요?</b>';
  $('#submit').innerHTML = '저장하기 <span class="arr" aria-hidden="true">→</span>';
  $('#fill').remove();
  for (const k of ['title', 'summary', 'maker', 'url', 'target', 'detail', 'github']) form[k].value = p[k] || '';
  form.tags.value = p.tags.join(', ');
  p.cats.forEach((c) => picked.add(c));
  $('#pub').checked = !!p.is_public;
  oldImg = p.images[0] || null;
  $('#pvImg').src = oldImg || FALLBACK_IMG;
  drawCats(); preview();
})();
</script>
</body>
</html>
